services:
  gluetun:
    image: qmcgaw/gluetun@sha256:495cdc65ace4c110cf4de3d1f5f90e8a1dd2eb0f8b67151d1ad6101b2a02a476
    container_name: gluetun
    # NET_ADMIN capability required for WireGuard VPN to modify kernel network routing tables
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ./.env
    environment:
      # Provider options live in .env: VPN_PROVIDER=protonvpn (default) or mullvad.
      # Mullvad has no port forwarding, so use VPN_PORT_FORWARDING=off with it.
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-protonvpn}
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-United States}
      - PORT_FORWARD_ONLY=${VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PROVIDER:-protonvpn}
      # gluetun's own control server defaults to :8000, which rTorrent's XMLRPC needs
      # (same network namespace), so move it out of the way.
      - HTTP_CONTROL_SERVER_ADDRESS=:8010
      # When the VPN forwards a port, tell rTorrent to listen on it.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --header=Content-Type:text/xml --post-data "<?xml version=\"1.0\"?><methodCall><methodName>network.listen.port.set</methodName><params><param><value><string></string></value></param><param><value><i8>{{PORT}}</i8></value></param></params></methodCall>" http://127.0.0.1:8000/RPC2 2>&1'
      - TZ=${TIMEZONE:-America/New_York}
    ports:
      - 127.0.0.1:8080:8080    # ruTorrent webui (rTorrent shares this network)
    restart: unless-stopped

  rtorrent:
    image: crazymax/rtorrent-rutorrent@sha256:a6577938d9b2d1e9038a9989c395990738c984ff6d7a2037a082a06bb4ab8a2d
    container_name: rtorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      # rTorrent config and session files (local disk, not the NAS)
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/rtorrent:/data
      # Downloads land in /downloads/complete/<label>; Radarr/Sonarr map this path to /data/downloads
      - ${MEDIA_DIR}/downloads:/downloads
      - rtorrent-run:/var/run/rtorrent
    restart: unless-stopped

  flood:
    image: jesec/flood@sha256:241f172786fe958a09a55615cb4cd1b15d0aec9751f2d87dd8d7a67bcd24f0fa
    container_name: flood
    user: "${PUID:-501}:${PGID:-20}"
    command:
      - --host
      - 0.0.0.0
      - --rundir
      - /flood-data
      - --auth
      - none
      - --rtsocket
      - /var/run/rtorrent/scgi.socket
    depends_on:
      - rtorrent
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/flood:/flood-data
      - rtorrent-run:/var/run/rtorrent
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:e74a1e093dcc223d671d4b7061e2b4946f1989a4d3059654ff4e623b731c9134
    container_name: prowlarr
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/prowlarr:/config
    ports:
      - 127.0.0.1:9696:9696
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:37be832b78548e3f55f69c45b50e3b14d18df1b6def2a4994258217e67efb1a1
    container_name: sonarr
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/sonarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 127.0.0.1:8989:8989
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:6d3e68474ea146f995af98d3fb2cb1a14e2e4457ddaf035aa5426889e2f9249c
    container_name: radarr
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/radarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 127.0.0.1:7878:7878
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:1cf40186b1bc35bec87f4e4892d5d8c06086da331010be03e3459a86869c5e74
    container_name: bazarr
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/bazarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 127.0.0.1:6767:6767
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=${TIMEZONE:-America/New_York}
    ports:
      - 127.0.0.1:8191:8191
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr@sha256:1b5fc1ea825631d9d165364472663b817a4c58ef6aa1013f58d82c1570d7c866
    container_name: seerr
    init: true
    environment:
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/seerr:/app/config
    ports:
      - ${SEERR_BIND_IP:-127.0.0.1}:5055:5055
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  emby:
    image: lscr.io/linuxserver/emby@sha256:4c3d0b88b7d8b79ee656ff016fd049b51585753ddbb9db984d6c230c39b4df74
    container_name: emby
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-${MEDIA_DIR}/config}/emby:/config
      - ${MEDIA_DIR}/movies:/data/movies
      - ${MEDIA_DIR}/tvshows:/data/tvshows
    ports:
      - 127.0.0.1:8096:8096
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/emby/System/Ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    profiles: ["autoupdate"]
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    volumes:
      # WARNING: Mounting docker.sock gives this container full control over all containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  rtorrent-run:
