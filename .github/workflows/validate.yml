name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n bootstrap.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run unit tests
        run: bash tests/run.sh

      - name: Validate media path usage
        run: |
          # Automation scripts must resolve MEDIA_DIR from env/.env, not hardcode $HOME/Media.
          # grep exits 1 only when there is no match; 0 = match (bad), 2 = error (bad).
          rc=0
          grep -nE '\$HOME/Media' scripts/auto-heal.sh scripts/install-auto-heal.sh scripts/auto-update.sh scripts/install-auto-update.sh || rc=$?
          [ "$rc" -eq 1 ]

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          VPN_PROVIDER=mullvad VPN_PORT_FORWARDING=off docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config >/dev/null
          rm .env
